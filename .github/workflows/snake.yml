name: Purple contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '12 4 * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#F7F2FC,#E6D2F8,#CDA2EE,#A569DE,#7635B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D8B4FE&color_dots=#15111F,#3B2257,#663797,#A463E2,#D8B4FE

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
